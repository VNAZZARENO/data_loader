# Descriptions par ticker (cle = ticker Bloomberg complet, cle jaune comprise).
# Base du catalogue partage <partage>/univers/descriptions.json :
#     python -m dl.descriptions seed [--dry-run] [--overwrite]
# Le seed ne remplace jamais une description saisie dans le dashboard.
#
# Sources : champ Bloomberg NAME du store (univers/store/<u>/_refdata.parquet, releve le
# 2026-10-09) pour l'identite de chaque instrument, conventions de marche pour les unites.
# « A VERIFIER » = identite ou unite non confirmee par les donnees de reference : a
# controler sur le terminal (DES) avant de s'appuyer sur la serie.
# Suffixes des futures : « 1 » / « 2 » = 1re / 2e echeance generique (roulee) ;
# « A » = contrat actif du moment. Prefixes souverains : GT = generique, CT = courant.

