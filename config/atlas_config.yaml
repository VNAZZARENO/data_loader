parameters:
  start_date: '2013-01-01'
  # end_date: omit or set to null to use today's date
  period: D
paths:
  source_xlsx: X:\Quant\Data\ATLAS_data.xlsx
  output_xlsx: X:\Quant\Data\ATLAS_data_{universe}_static.xlsx
bloomberg:
  batch_size: 250
  ticker_suffix: ' Equity'
  # BDH options matching Excel formula: CDR=5D ensures every business day
  # is returned, with forward-fill for sparse fields like IS_EPS
  bdh_options:
    Calendar: '5D'
    Days: N
    Fill: P
# Default fields (used when no --agents flag is specified)
fields:
  price: PX_LAST
  Pxtobook: PX_TO_BOOK_RATIO
  EPS: IS_EPS

# Agent-specific field profiles (selected via --agents)
agents:
  default:
    fields:
      price: PX_LAST
      Pxtobook: PX_TO_BOOK_RATIO
      EPS: IS_EPS
  squeeze:
    fields:
      price: PX_LAST
      open: PX_OPEN
      high: PX_HIGH
      low: PX_LOW
      volume: PX_VOLUME
      short_int: SHORT_INT
      si_pct_float: SI_PERCENT_OF_FLOAT
      short_ratio: SHORT_INT_RATIO
      sl_fee: SL_AVG_1M_FEE
      sl_utilization: SL_UTILIZATION
      sl_on_loan: SL_ON_LOAN_QTY
      sl_lendable: SL_LENDABLE_QTY
      float_shares: EQY_FLOAT
      shares_out: EQY_SH_OUT
      inst_pct: EQY_INST_PCT_SH_OUT
      insider_pct: INSIDER_HOLDING_PCT

# Dynamic ticker resolution for the option_* universes (--mode bt|screening).
# Tickers come from the GetFundPortfolios API over https, because the loader
# runs on the Bloomberg terminal machine and not the dev box.
option_modes:
  fund: PEQ
  api_base_url: https://pergam-tools/getfundportfolios-api
  # Earliest position date to scan. null -> every date the API has (back to 2021).
  # 2024-12-31 = start of the fund's quant era, which is the period the backtests
  # actually cover: it yields 261 tickers instead of 384 for identical coverage of
  # the names the PEQ overlay study was missing (33/33 either way).
  # After changing this, rerun with --refresh-universe: the cached CSV wins otherwise.
  bt_since: '2024-12-31'
  # Screening only needs current IV, not the full history.
  screening_months: 12
  # Each mode writes its OWN file: a screening run must never overwrite the
  # long history the backtests depend on.
  output_universe:
    bt: option_europe_bt
    screening: option_screening

universes:
  default: sxxr
  available:
    - sxxr
    - nky
    - spx
    - pbh
    - sx5e
    - splpeqty
    - jp
    - global_macro
    - igv
    - euro_credit
    - option_europe
universe_overrides:
  global_macro:
    ticker_suffix: ''
    fields:
      price: PX_LAST
  euro_credit:
    ticker_suffix: ''
    fields:
      total_return: DAY_TO_DAY_TOT_RETURN_GROSS_DVDS
      oas: OAS_SPREAD_BID
      ytw: YLD_YTW_BID
      duration: DUR_ADJ_MID
      spread_duration: DUR_ADJ_OAS_BID
      bid_ask: BID_ASK_SPREAD
    bdh_options:
      Calendar: '5D'
      Days: N
      Fill: P
  # IV-surface universe for OTM put / volatility-tail work (PEQ).
  # Mixed equities + indices -> ticker_suffix '' (full tickers in CSV).
  # NOTE: the moneyness mnemonics (*_IMPVOL_*%MNY_DF) must be validated
  # against the Bloomberg terminal (FLDS / --test); prune any that return
  # empty. PUT_IMP_VOL_* and the CALL_IMP_VOL_*/flow fields are the
  # high-confidence continuity set already used for the sxxr vol CSVs.
  option_europe:
    ticker_suffix: ''
    fields:
      price: PX_LAST
      # --- ATM call vol + options flow (continuity with sxxr vol CSVs) ---
      vol_10d: CALL_IMP_VOL_10D
      vol_1m: CALL_IMP_VOL_30D
      vol_2m: CALL_IMP_VOL_60D
      put_call_ratio: PUT_CALL_VOLUME_RATIO_CUR_DAY
      total_call_volume: VOLUME_TOTAL_CALL
      earning_implied_move: EARNINGS_RELATED_IMPLIED_MOVE
      # --- moneyness IV surface (mnemonics validated via probe_iv_fields.py) ---
      # tenors: 30DAY 60DAY 3MTH 6MTH 12MTH 18MTH 24MTH (front / back / LEAP)
      # pillars: 90/95/97.5 = OTM put wing, 100 = ATM, 105/110 = call (skew/RR)
      # NB: <90% moneyness (deep OTM) is NOT published by Bloomberg for these
      # names -> deeper strikes require the option chain, not the surface.
      iv_1m_90:     '30DAY_IMPVOL_90.0%MNY_DF'
      iv_1m_95:     '30DAY_IMPVOL_95.0%MNY_DF'
      iv_1m_975:    '30DAY_IMPVOL_97.5%MNY_DF'
      iv_1m_100:    '30DAY_IMPVOL_100.0%MNY_DF'
      iv_1m_105:    '30DAY_IMPVOL_105.0%MNY_DF'
      iv_1m_110:    '30DAY_IMPVOL_110.0%MNY_DF'
      iv_2m_90:     '60DAY_IMPVOL_90.0%MNY_DF'
      iv_2m_95:     '60DAY_IMPVOL_95.0%MNY_DF'
      iv_2m_975:    '60DAY_IMPVOL_97.5%MNY_DF'
      iv_2m_100:    '60DAY_IMPVOL_100.0%MNY_DF'
      iv_2m_105:    '60DAY_IMPVOL_105.0%MNY_DF'
      iv_2m_110:    '60DAY_IMPVOL_110.0%MNY_DF'
      iv_3m_90:     '3MTH_IMPVOL_90.0%MNY_DF'
      iv_3m_95:     '3MTH_IMPVOL_95.0%MNY_DF'
      iv_3m_975:    '3MTH_IMPVOL_97.5%MNY_DF'
      iv_3m_100:    '3MTH_IMPVOL_100.0%MNY_DF'
      iv_3m_105:    '3MTH_IMPVOL_105.0%MNY_DF'
      iv_3m_110:    '3MTH_IMPVOL_110.0%MNY_DF'
      iv_6m_90:     '6MTH_IMPVOL_90.0%MNY_DF'
      iv_6m_95:     '6MTH_IMPVOL_95.0%MNY_DF'
      iv_6m_975:    '6MTH_IMPVOL_97.5%MNY_DF'
      iv_6m_100:    '6MTH_IMPVOL_100.0%MNY_DF'
      iv_6m_105:    '6MTH_IMPVOL_105.0%MNY_DF'
      iv_6m_110:    '6MTH_IMPVOL_110.0%MNY_DF'
      iv_12m_90:    '12MTH_IMPVOL_90.0%MNY_DF'
      iv_12m_95:    '12MTH_IMPVOL_95.0%MNY_DF'
      iv_12m_975:   '12MTH_IMPVOL_97.5%MNY_DF'
      iv_12m_100:   '12MTH_IMPVOL_100.0%MNY_DF'
      iv_12m_105:   '12MTH_IMPVOL_105.0%MNY_DF'
      iv_12m_110:   '12MTH_IMPVOL_110.0%MNY_DF'
      iv_18m_90:    '18MTH_IMPVOL_90.0%MNY_DF'
      iv_18m_95:    '18MTH_IMPVOL_95.0%MNY_DF'
      iv_18m_975:   '18MTH_IMPVOL_97.5%MNY_DF'
      iv_18m_100:   '18MTH_IMPVOL_100.0%MNY_DF'
      iv_18m_105:   '18MTH_IMPVOL_105.0%MNY_DF'
      iv_18m_110:   '18MTH_IMPVOL_110.0%MNY_DF'
      iv_24m_90:    '24MTH_IMPVOL_90.0%MNY_DF'
      iv_24m_95:    '24MTH_IMPVOL_95.0%MNY_DF'
      iv_24m_975:   '24MTH_IMPVOL_97.5%MNY_DF'
      iv_24m_100:   '24MTH_IMPVOL_100.0%MNY_DF'
      iv_24m_105:   '24MTH_IMPVOL_105.0%MNY_DF'
      iv_24m_110:   '24MTH_IMPVOL_110.0%MNY_DF'
    bdh_options:
      Calendar: '5D'
      Days: N
      Fill: P
# --update-universe: refresh tickers/<universe>.csv from BDS INDX_MEMBERS on the
# universe's benchmark index (below). The Bloomberg->project exchange-code map is
# LEARNED from the existing CSV at runtime; this block only holds manual fallbacks
# for a country with no existing sample, and an optional index override when the
# membership index differs from the benchmark used for the return series.
index_members:
  # index_override:
  #   sxxr: SXXP Index   # price-return twin; identical members to SXXR
  exchange_code_map:
    SW: SE   # SIX Swiss Exchange -> project convention (e.g. ROP SW -> ROP SE)
    SM: SQ   # Bolsa de Madrid    -> project convention (e.g. SAN SM -> SAN SQ)

benchmarks:
  jp: JPL Index
  sxxr: SXXR Index
  nky: NKY Index
  spx: SPX Index
  sx5e: SX5E Index
  pbh: WLSN Index
  splpeqty: SPLPEQTY Index
  euro_credit: LECPTREU Index
