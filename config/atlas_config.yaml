parameters:
  start_date: '2013-01-01'
  # end_date: omit or set to null to use today's date
  period: D
paths:
  source_xlsx: X:\Quant\Data\ATLAS_data.xlsx
  output_xlsx: X:\Quant\Data\ATLAS_data_{universe}_static.xlsx
bloomberg:
  batch_size: 250
  ticker_suffix: ' Equity'
  # BDH options matching Excel formula: CDR=5D ensures every business day
  # is returned, with forward-fill for sparse fields like IS_EPS
  bdh_options:
    Calendar: '5D'
    Days: N
    Fill: P
# Default fields (used when no --agents flag is specified)
fields:
  price: PX_LAST
  Pxtobook: PX_TO_BOOK_RATIO
  EPS: IS_EPS

# Agent-specific field profiles (selected via --agents)
agents:
  default:
    fields:
      price: PX_LAST
      Pxtobook: PX_TO_BOOK_RATIO
      EPS: IS_EPS
  squeeze:
    fields:
      price: PX_LAST
      open: PX_OPEN
      high: PX_HIGH
      low: PX_LOW
      volume: PX_VOLUME
      short_int: SHORT_INT
      si_pct_float: SI_PERCENT_OF_FLOAT
      short_ratio: SHORT_INT_RATIO
      sl_fee: SL_AVG_1M_FEE
      sl_utilization: SL_UTILIZATION
      sl_on_loan: SL_ON_LOAN_QTY
      sl_lendable: SL_LENDABLE_QTY
      float_shares: EQY_FLOAT
      shares_out: EQY_SH_OUT
      inst_pct: EQY_INST_PCT_SH_OUT
      insider_pct: INSIDER_HOLDING_PCT
universes:
  default: sxxr
  available:
    - sxxr
    - nky
    - spx
    - pbh
    - sx5e
    - splpeqty
    - jp
    - global_macro
    - igv
universe_overrides:
  global_macro:
    ticker_suffix: ''
    fields:
      price: PX_LAST
benchmarks:
  jp: JPL Index
  sxxr: SXXR Index
  nky: NKY Index
  spx: SPX Index
  sx5e: SX5E Index
  pbh: WLSN Index
  splpeqty: SPLPEQTY Index
